name: Remove source comments

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove comments safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import io
          import re
          import tokenize

          roots = [Path('src'), Path('projects')]

          def strip_ts_like(text):
              text = re.sub(r'\{\s*/\*[\s\S]*?\*/\s*\}', '', text)
              text = re.sub(r'/\*[\s\S]*?\*/', '', text)
              text = re.sub(r'(?m)^[ \t]*//[^\n]*(?:\n|$)', '', text)
              return text

          def strip_css(text):
              return re.sub(r'/\*[\s\S]*?\*/', '', text)

          def strip_html(text):
              return re.sub(r'<!--[\s\S]*?-->', '', text)

          def strip_python(text):
              tokens = []
              try:
                  for token in tokenize.generate_tokens(io.StringIO(text).readline):
                      if token.type != tokenize.COMMENT:
                          tokens.append(token)
                  return tokenize.untokenize(tokens)
              except (tokenize.TokenError, IndentationError):
                  return text

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  suffix = path.suffix.lower()
                  if suffix not in {'.ts', '.tsx', '.js', '.jsx', '.css', '.html', '.py'}:
                      continue
                  old = path.read_text(encoding='utf-8')
                  if suffix in {'.ts', '.tsx', '.js', '.jsx'}:
                      new = strip_ts_like(old)
                  elif suffix == '.css':
                      new = strip_css(old)
                  elif suffix == '.html':
                      new = strip_html(old)
                  else:
                      new = strip_python(old)
                  if new != old:
                      path.write_text(new, encoding='utf-8')
          PY
      - name: Commit cleaned source
        shell: bash
        run: |
          if git diff --quiet -- src projects; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src projects
          git commit -m "Remove remaining source comments"
          git push
